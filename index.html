
<!DOCTYPE html>
<html>
<head>
    <title>Kalkulator Total Harga</title>
</head>
<body>
    <h2>Menghitung Total Harga</h2>

    <label>Harga Barang (Rp):</label>
    <input type="number" id="harga" value="5000">

    <br><br>

    <label>Jumlah Barang:</label>
    <input type="number" id="jumlah" value="3">

    <br><br>

    <button onclick="hitungTotal()">Hitung Total</button>

    <h3 id="hasil"></h3>

    <script>
        function hitungTotal() {
            // Deklarasi variabel
            let hargaBarang = Number(
                document.getElementById("harga").value
            );

            let jumlahBarang = Number(
                document.getElementById("jumlah").value
            );

            // Menghitung total harga
            let totalHarga = hargaBarang * jumlahBarang;

            // Menampilkan hasil
            document.getElementById("hasil").innerHTML =
                "Total Harga: Rp " +
                totalHarga.toLocaleString("id-ID");
        }
    </script>
</body>
  </html>
